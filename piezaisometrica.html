  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  gsap.registerPlugin(ScrollTrigger);

  const partesDelReloj = gsap.utils.toArray("#a > *:not(defs)");

  gsap.from(partesDelReloj, {
    scrollTrigger: {
      trigger: "#contenedor-reloj",
      start: "top top",      // Inicia exactamente cuando el contenedor toca el techo de la pantalla
      end: "+=120%",         // Añade un "falso scroll" del 150% del alto de la pantalla para dar tiempo a la animación
      pin: true,             // ¡LA MAGIA! Fija el reloj en pantalla hasta que acabe de montarse
      scrub: 1,              
    },
    y: 300,                  // Como hemos puesto overflow: visible, podemos hacer que vengan desde mucho más abajo
    autoAlpha: 0,
    stagger: 0.1             // Distribuye el tiempo de cada pieza equitativamente a lo largo del scroll
  });
});
  </script>
